# Max Pain Calculator Configuration
# ===================================

[DATA_SOURCE]
# Data source: CBOE or YF (Yahoo Finance)
source = YF

[TICKER_SELECTION]
# Path to CSV file with a 'ticker' column header (relative to project root or absolute)
ticker_file = user_input/nasdaq100_tickers.csv

# Legacy keys (kept as reference, no longer used):
# ticker_choice = 7
# ticker_list = NVDA
# local_tickers_dir = data/tickers

[CALCULATION]
# Expiration date to analyze
# Options:
#   - "current_3Fr_monthly" = 3rd Friday of the current month (today's month)
#   - "next_3Fr_monthly"    = 3rd Friday of next month (advances past mid-month)
#   - "YYYY-MM-DD"          = specific date (e.g., "2025-12-19")
expiration_date = current_3Fr_monthly

# For YF source: how to select expiration if exact date not available
# Options: nearest, next_available, exact
yf_expiration_selection = nearest

# Current price source: last_trade, close, or manual
price_source = last_trade

# Option types to include: both, calls_only, puts_only
option_types = both

# --- Mod 1: Strike band filter ---
# Restrict analysis to strikes within ±N% of the current spot price.
# Eliminates deep-OTM strikes that can skew the min-pain result.
# Set to 0 to disable.
strike_band_pct = 0

# --- Mod 2: Minimum open interest threshold ---
# Drop strikes where Call_OI + Put_OI < this value.
# Prevents single-contract noise spikes in the pain curve.
# Set to 0 to disable.
min_open_interest = 10

# --- Mod 3: Dollar-weighted OI ---
# Weight each strike's OI by its dollar notional (OI × Strike).
# Gives proportionally more influence to high-priced strikes.
dollar_weighted_oi = false

# --- Mod 6: Volume-weighted OI ---
# Substitute today's traded volume for open interest in the pain formula.
# Volume reflects where active money moved TODAY, whereas OI reflects
# accumulated positioning over time.
# Falls back to OI automatically if volume data is absent or all-zero
# (e.g. pre-market, or older CSV files without volume columns).
# Composes with dollar_weighted_oi: enabling both gives Volume × Strike.
# Requires YF data source (volume is captured alongside OI).
volume_weighted_oi = false

# --- Mod 4: Smooth pain curve ---
# Apply a centred rolling average over the pain values before finding
# the minimum, avoiding jagged jumps between adjacent strikes.
smooth_pain_curve = false
smoothing_window = 3

[OUTPUT]
# Output directory for reports
output_dir = results

# Output formats (comma-separated): html, csv, json, png
output_formats = html,csv,json,pdf

# Chart generation settings
generate_charts = true
chart_dir = results/charts
chart_dpi = 150
chart_width = 12
chart_height = 6
# Chart types: total_payout, open_interest, pain_comparison, gamma_overlay, all
# Note: gamma_overlay requires gamma data (YF source only; skipped silently if unavailable)
chart_types = total_payout,open_interest,gamma_overlay

# Sort results by: net_premium, ticker, pct_change
sort_by = net_premium

# Top N tickers to highlight (like asterisk in PDF report)
highlight_top_n = 20

[CBOE]
# CBOE-specific settings
base_url = https://www.cboe.com/delayed_quotes/
# Directory for CBOE CSV files
data_dir = data/raw/cboe
# Rate limiting (seconds between requests)
rate_limit_delay = 2
# Timeout for requests (seconds)
request_timeout = 30
# Download-first architecture settings
download_phase_enabled = true
# Skip download if file already exists
overwrite_existing = false

[YAHOO_FINANCE]
# Yahoo Finance-specific settings
use_yfinance_library = true

# Download-first architecture settings
# Set download_phase_enabled to true for 2-phase download/process workflow
download_phase_enabled = true
download_dir = data/raw/yf
# Skip download if file already exists
overwrite_existing = false

# Data caching settings (future use)
cache_downloads = true
cache_dir = data/raw/yf
cache_expiry_minutes = 60

# Download retry and rate limiting settings
max_retries = 3
retry_delay_seconds = 2
# Seconds to wait between ticker downloads in batch mode
rate_limit_delay = 1

[LOGGING]
# Logging level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Log file location
log_file = logs/max_pain.log
