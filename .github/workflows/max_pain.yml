name: Max Pain Calculator

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  # 1. Manual run — full control over ticker list and expiration date
  workflow_dispatch:
    inputs:

      ticker_file:
        description: 'Ticker list (path relative to python/). CSV or .txt (plain or TradingView watchlist format).'
        required: true
        default: 'user_input/test.csv'
        type: choice
        options:
          - user_input/test.csv
          - user_input/p_pullbackMarMai2026.txt
          - user_input/earningsbeats_tickers.txt
          - user_input/nasdaq100_tickers.csv
          - user_input/sp500_tickers.csv
          - user_input/russell3000_tickers.csv
          - user_input/iwm1000_tickers.csv
          - user_input/Ioa_port.txt

      expiration_date:
        description: |
          Expiration date.
          Keywords: current_3Fr_monthly | next_3Fr_monthly
          Or a specific date: YYYY-MM-DD (e.g. 2026-03-21)
        required: true
        default: 'next_3Fr_monthly'
        type: string

      strike_band_pct:
        description: |
          Strike band filter — keep only strikes within ±N% of spot price.
          Prevents deep-OTM strikes from skewing the max pain result.
          Set to 0 to disable.
        required: false
        default: '15'
        type: string

      min_open_interest:
        description: |
          Minimum open interest threshold — drop strikes where Call_OI + Put_OI
          is below this value. Removes single-contract noise spikes.
          Set to 0 to disable.
        required: false
        default: '10'
        type: string

      volume_weighted_oi:
        description: |
          Use today's traded volume instead of open interest in the pain formula.
          Useful for mid-session runs where active flow matters more than
          accumulated positioning. Falls back to OI if volume is absent or zero.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      data_source:
        description: |
          Data source for option chain data.
          YF = Yahoo Finance (use during/right after market hours).
          CBOE_JSON = CBOE delayed-quotes JSON API (use for after-hours runs —
          serves last EOD snapshot regardless of time, avoids YF zero-OI problem).
        required: false
        default: 'YF'
        type: choice
        options:
          - 'YF'
          - 'CBOE_JSON'

  # 2. Scheduled run — the Friday ONE WEEK BEFORE monthly expiration (3rd Friday),
  #    at 21:30 UTC (5:30 pm ET) after market close.
  #    The 2nd Friday always falls between the 8th and 14th, so this is exact.
  schedule:
    - cron: '30 21 8-14 * 5'

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # Resolve which ticker file(s) to run.
  # - schedule  → runs nasdaq100 + sp500 in parallel (matrix)
  # - dispatch  → runs the file chosen in the UI
  # -------------------------------------------------------------------------
  setup:
    name: Resolve ticker files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.resolve.outputs.files }}
    steps:
      - name: Resolve ticker file list
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'files=["user_input/nasdaq100_tickers.csv","user_input/sp500_tickers.csv","user_input/iwm1000_tickers.csv","user_input/Ioa_port.txt"]' >> $GITHUB_OUTPUT
          else
            echo 'files=["${{ inputs.ticker_file }}"]' >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------------------
  # Main calculation job — runs once per file in the matrix.
  # -------------------------------------------------------------------------
  max-pain:
    name: Calculate Max Pain (${{ matrix.ticker_file }})
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ticker_file: ${{ fromJson(needs.setup.outputs.files) }}
      fail-fast: false   # let the other file finish even if one fails

    # All run steps execute inside the python/ subdirectory
    defaults:
      run:
        working-directory: python

    steps:

      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Patch expiration_date in config.ini.
      # On scheduled runs inputs are empty — fall back to next_3Fr_monthly.
      # sed -i preserves all comments and other keys unchanged.
      - name: Set expiration date
        env:
          EXP_DATE: ${{ inputs.expiration_date || 'next_3Fr_monthly' }}
        run: |
          sed -i "s/^expiration_date = .*/expiration_date = ${EXP_DATE}/" config.ini
          echo "expiration_date set to: ${EXP_DATE}"

      # -----------------------------------------------------------------------
      # Set data source. Scheduled runs always use YF (inputs.data_source is
      # empty on schedule → falls back to 'YF'). Manual runs use the dropdown.
      - name: Set data source
        env:
          DATA_SOURCE: ${{ inputs.data_source || 'YF' }}
        run: |
          sed -i "s/^source = .*/source = ${DATA_SOURCE}/" config.ini
          echo "Data source set to: ${DATA_SOURCE}"

      # -----------------------------------------------------------------------
      # Patch calculation enhancement params when overridden via dispatch input.
      # On scheduled runs inputs are empty — config.ini defaults are kept.
      - name: Apply calculation parameters
        env:
          STRIKE_BAND:   ${{ inputs.strike_band_pct || '' }}
          MIN_OI:        ${{ inputs.min_open_interest || '' }}
          VOL_WEIGHTED:  ${{ inputs.volume_weighted_oi || '' }}
        run: |
          if [ -n "${STRIKE_BAND}" ]; then
            sed -i "s/^strike_band_pct = .*/strike_band_pct = ${STRIKE_BAND}/" config.ini
            echo "strike_band_pct set to: ${STRIKE_BAND}"
          fi
          if [ -n "${MIN_OI}" ]; then
            sed -i "s/^min_open_interest = .*/min_open_interest = ${MIN_OI}/" config.ini
            echo "min_open_interest set to: ${MIN_OI}"
          fi
          if [ -n "${VOL_WEIGHTED}" ]; then
            sed -i "s/^volume_weighted_oi = .*/volume_weighted_oi = ${VOL_WEIGHTED}/" config.ini
            echo "volume_weighted_oi set to: ${VOL_WEIGHTED}"
          fi

      # -----------------------------------------------------------------------
      - name: Run Max Pain Calculator
        run: |
          echo "Ticker file : ${{ matrix.ticker_file }}"
          python main.py --ticker-file "${{ matrix.ticker_file }}"

      # -----------------------------------------------------------------------
      # Artifact names include a slug of the ticker file so both matrix jobs
      # upload to distinct artifacts in the same run.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-pain-results-${{ github.run_id }}-${{ strategy.job-index }}
          path: python/results/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-pain-logs-${{ github.run_id }}-${{ strategy.job-index }}
          path: python/logs/
          retention-days: 30
